<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Nunca utilizar a tag main, em nenhum caso — a partir do body é sempre direto header/section/footer -->
    <!-- Header só existe se o Figma desenhar um bloco de nav/header próprio; se não desenhar, começa direto em section.s1 -->
    <header>
        <!-- Utilizar dentro de cada sessao ou tag html uma div ou outra tag html que faça sentido nesse contexto, ela será o direcionamento para reduzir ou aumentar as margins laterais nas páginas, utilizando tanto como margin, padding ou orientar o conteudo interno dessa classe com width -->
         <!-- Se necessário poderá ser criado outras classes para margins, padding e width diferentes dependendo da orientação que está no figma, mas sempre se for igual as margins utilizar mesma classe css -->
        <div class="container"></div>
    </header>
    <!-- depois do body, separa por sessoes, cada possivel sessao no figma -->
    <section class="s1">
        <div class="container"></div>
    </section>
    <section class="s2">
        <div class="container"></div>
    </section>
    <section class="s3">
        <div class="container"></div>
    </section>
    <section class="s4">
        <div class="container"></div>
    </section>
    <footer>
        <div class="container"></div>
    </footer>
</body>
</html>
